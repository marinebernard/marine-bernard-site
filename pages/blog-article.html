<script>
const cur=document.getElementById('cursor-flower');
let mx=0,my=0,cx=0,cy=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
(function loop(){cx+=(mx-cx)*0.13;cy+=(my-cy)*0.13;cur.style.left=cx+'px';cur.style.top=cy+'px';requestAnimationFrame(loop)})();

/* ── MENU MOBILE ── */
const navToggle=document.getElementById('navToggle');
const navLinksEl=document.querySelector('.nav-links');
navToggle?.addEventListener('click',()=>{
  navToggle.classList.toggle('open');
  navLinksEl.classList.toggle('open');
});
navLinksEl?.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{
  navToggle?.classList.remove('open');
  navLinksEl.classList.remove('open');
}));

/* ── RENDU CONTENU (## / ### / **gras** / *italique* / ✦ liste / > citation / ---) ── */
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}
function inlineFormat(s) {
  return escapeHtml(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}
function renderContenu(text) {
  const lines = (text || '').split('\n');
  let html = '';
  let inList = false;
  function closeList() { if (inList) { html += '</div>'; inList = false; } }
  lines.forEach(raw => {
    const line = raw.trim();
    if (line === '') { closeList(); return; }
    if (line === '---') { closeList(); html += '<hr class="article-divider">'; return; }
    if (line.startsWith('### ')) { closeList(); html += `<h3 class="article-h3">${inlineFormat(line.slice(4))}</h3>`; return; }
    if (line.startsWith('## ')) { closeList(); html += `<h2 class="article-h2">${inlineFormat(line.slice(3))}</h2>`; return; }
    if (line.startsWith('> ')) { closeList(); html += `<div class="article-quote">${inlineFormat(line.slice(2))}</div>`; return; }
    if (line.startsWith('✦')) {
      if (!inList) { html += '<div class="article-list">'; inList = true; }
      html += `<div class="article-list-item">${inlineFormat(line.replace(/^✦\s*/, ''))}</div>`;
      return;
    }
    closeList();
    html += `<p class="article-text">${inlineFormat(line)}</p>`;
  });
  closeList();
  return html;
}

/* ── CHARGEMENT DE L'ARTICLE ── */
(async function loadArticle() {
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const loadingEl = document.getElementById('articleLoading');
  const notFoundEl = document.getElementById('articleNotFound');
  const contentEl = document.getElementById('articleContent');

  if (!slug) {
    loadingEl.style.display = 'none';
    notFoundEl.style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/articles.php?slug=' + encodeURIComponent(slug));
    const a = await res.json();
    if (!res.ok || a.error) {
      loadingEl.style.display = 'none';
      notFoundEl.style.display = 'block';
      return;
    }

    document.getElementById('pageTitle').textContent = a.titre + ' — La Ch\'tite Randonneuse · Marine Bernard';
    if (a.extrait) document.getElementById('pageDesc').setAttribute('content', a.extrait);
    document.getElementById('breadcrumbTitre').textContent = a.titre;
    document.getElementById('articleTitre').textContent = a.titre;

    if (a.photo_principale) {
      document.getElementById('articleHero').style.backgroundImage =
        `url('/${a.photo_principale}')`;
    } else {
      document.getElementById('articleHero').style.background =
        'linear-gradient(135deg,#27500A,#3B6D11,#C9A96E)';
    }

    if (a.date_publication) {
      const date = new Date(a.date_publication).toLocaleDateString('fr-FR', {month:'long', year:'numeric'});
      document.getElementById('articleDate').textContent = date;
    }
    if (a.temps_lecture) {
      document.getElementById('articleTempsSep').style.display = 'inline-flex';
      document.getElementById('articleTemps').textContent = a.temps_lecture + ' min de lecture';
    }

    document.getElementById('articleCorps').innerHTML = renderContenu(a.contenu);

    loadingEl.style.display = 'none';
    contentEl.style.display = 'block';

    document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
  } catch(e) {
    loadingEl.style.display = 'none';
    notFoundEl.style.display = 'block';
  }
})();
</script>
